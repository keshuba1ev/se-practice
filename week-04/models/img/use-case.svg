<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="683px" preserveAspectRatio="none" style="width:950px;height:683px;background:#FFFFFF;" version="1.1" viewBox="0 0 950 683" width="950px" zoomAndPan="magnify"><?plantuml 1.2026.6?><defs/><g><!--cluster Smart Campus Study Room Booking System--><g class="cluster" data-qualified-name="Smart Campus Study Room Booking System" data-source-line="6" id="ent0003"><rect fill="none" height="333" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:1;" width="488.5" x="163" y="75.5"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="347.5322" x="233.4839" y="90.4951">Smart Campus Study Room Booking System</text></g><!--entity Student--><g class="entity" data-qualified-name="Student" data-source-line="3" id="ent0001"><ellipse cx="54.0557" cy="158" fill="#F1F1F1" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M54.0557,166 L54.0557,193 M41.0557,174 L67.0557,174 M54.0557,193 L41.0557,208 M54.0557,193 L67.0557,208" fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="55.1113" x="26.5" y="222.4951">Student</text></g><!--entity Administrator--><g class="entity" data-qualified-name="Administrator" data-source-line="4" id="ent0002"><ellipse cx="53.8413" cy="318" fill="#F1F1F1" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M53.8413,326 L53.8413,353 M40.8413,334 L66.8413,334 M53.8413,353 L40.8413,368 M53.8413,353 L66.8413,368" fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="95.6826" x="6" y="382.4951">Administrator</text></g><g class="entity" data-qualified-name="GMN16" data-source-line="26" id="ent0017"><path d="M461,417 L461,517.7969 A0,0 0 0 0 461,517.7969 L686.0708,517.7969 A0,0 0 0 0 686.0708,517.7969 L686.0708,427 L676.0708,417 L469.7532,417 L308.1618,190.3479 L461.7532,417 L461,417 A0,0 0 0 0 461,417" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M676.0708,417 L676.0708,427 L686.0708,427 L676.0708,417" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="204.0708" x="467" y="434.0669">R1: Start must be in the future.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="195.6157" x="467" y="449.1997">Duration &gt; 0 and &lt;= 2 hours.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="176.4268" x="467" y="464.3325">R2: Active bookings for the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="179.3086" x="467" y="479.4653">same room cannot overlap.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="176.4077" x="467" y="494.5981">R3: A blocked room cannot</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="146.7642" x="467" y="509.731">accept a new booking.</text></g><g class="entity" data-qualified-name="GMN19" data-source-line="35" id="ent0020"><path d="M723,167.5 L723,183.5 L643.6334,187.5 L723,191.5 L723,207.7656 A0,0 0 0 0 723,207.7656 L934.0933,207.7656 A0,0 0 0 0 934.0933,207.7656 L934.0933,177.5 L924.0933,167.5 L723,167.5 A0,0 0 0 0 723,167.5" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M924.0933,167.5 L924.0933,177.5 L934.0933,177.5 L924.0933,167.5" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="190.0933" x="729" y="184.5669">R4: Every successful booking</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="162.7285" x="729" y="199.6997">produces a confirmation.</text></g><g class="entity" data-qualified-name="GMN22" data-source-line="40" id="ent0023"><path d="M139,12 L139,67.3984 A0,0 0 0 0 139,67.3984 L244.5,67.3984 L248.5,102.4258 L252.5,67.3984 L358.0215,67.3984 A0,0 0 0 0 358.0215,67.3984 L358.0215,22 L348.0215,12 L139,12 A0,0 0 0 0 139,12" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M348.0215,12 L348.0215,22 L358.0215,22 L348.0215,12" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="128.6797" x="145" y="29.0669">Availability reflects:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="198.0215" x="145" y="44.1997">- existing active bookings (R2)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="135.9668" x="145" y="59.3325">- blocked rooms (R3)</text></g><!--entity UC01--><g class="entity" data-qualified-name="Smart Campus Study Room Booking System.UC01" data-source-line="7" id="ent0004"><ellipse cx="248.2558" cy="128.4494" fill="#F1F1F1" rx="58.2558" ry="25.9494" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="78.4766" x="209.0175" y="125.0881">View Room</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="77.1299" x="209.6909" y="141.3849">Availability</text></g><!--entity UC02--><g class="entity" data-qualified-name="Smart Campus Study Room Booking System.UC02" data-source-line="8" id="ent0005"><ellipse cx="248.4194" cy="187.5236" fill="#F1F1F1" rx="59.4194" ry="14.5236" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="79.7891" x="208.5249" y="192.1721">Book Room</text></g><!--entity UC03--><g class="entity" data-qualified-name="Smart Campus Study Room Booking System.UC03" data-source-line="9" id="ent0006"><ellipse cx="248.5229" cy="244.5499" fill="#F1F1F1" rx="58.0229" ry="24.5499" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="83.2207" x="206.9125" y="243.2468">Cancel Own</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="56.4922" x="220.2768" y="259.5436">Booking</text></g><!--entity UC04--><g class="entity" data-qualified-name="Smart Campus Study Room Booking System.UC04" data-source-line="10" id="ent0007"><ellipse cx="248.4065" cy="310.6658" fill="#F1F1F1" rx="77.4065" ry="23.6658" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="117.3525" x="189.7303" y="310.7549">Block or Unblock</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="40.4961" x="228.1585" y="327.0518">Room</text></g><!--entity UC05--><g class="entity" data-qualified-name="Smart Campus Study Room Booking System.UC05" data-source-line="11" id="ent0008"><ellipse cx="248.7297" cy="376.3919" fill="#F1F1F1" rx="64.2297" ry="23.8919" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="95.5254" x="200.967" y="376.1166">Review Room</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="43.6201" x="226.9196" y="392.4134">Usage</text></g><!--entity UC06--><g class="entity" data-qualified-name="Smart Campus Study Room Booking System.UC06" data-source-line="12" id="ent0009"><ellipse cx="573.6071" cy="187.7362" fill="#F1F1F1" rx="70.1071" ry="25.7362" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="96.2021" x="525.506" y="184.6792">Send Booking</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="90.8223" x="528.196" y="200.976">Confirmation</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" data-link-type="dependency" id="lnk10"><polygon fill="#181818" points="189.7192,146.2094,179.9421,145.0224,184.9387,147.6746,182.2864,152.6712,189.7192,146.2094" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M81.7663,179.2963 C109.5562,170.7789 149.1128,158.655 184.9387,147.6746" fill="none" style="stroke:#181818;stroke-width:1;"/></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0005" data-link-type="dependency" id="lnk11"><polygon fill="#181818" points="188.9187,187.5,179.9187,183.5,183.9187,187.5,179.9187,191.5,188.9187,187.5" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M81.7663,187.5 C109.3496,187.5 148.2349,187.5 183.9187,187.5" fill="none" style="stroke:#181818;stroke-width:1;"/></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0006" data-link-type="dependency" id="lnk12"><polygon fill="#181818" points="190.1184,227.5091,182.6244,221.1184,185.3241,226.0895,180.3531,228.7892,190.1184,227.5091" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M81.7663,195.4256 C109.6595,203.6849 149.429,215.4608 185.3241,226.0895" fill="none" style="stroke:#181818;stroke-width:1;"/></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0007" data-link-type="dependency" id="lnk13"><polygon fill="#181818" points="170.8982,325.2235,161.305,322.9941,165.9881,326.1672,162.815,330.8503,170.8982,325.2235" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M102.0908,338.4488 C122.794,334.4695 142.735,330.6367 165.9881,326.1672" fill="none" style="stroke:#181818;stroke-width:1;"/></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0008" data-link-type="dependency" id="lnk14"><polygon fill="#181818" points="184.1788,366.9607,175.8751,361.6646,179.2345,366.2159,174.6833,369.5753,184.1788,366.9607" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M102.0908,354.5942 C126.801,358.3168 152.4761,362.1847 179.2345,366.2159" fill="none" style="stroke:#181818;stroke-width:1;"/></g><g class="link" data-entity-1="ent0005" data-entity-2="ent0009" data-link-type="dependency" id="lnk15"><polygon fill="#181818" points="503.3803,187.5,494.3803,183.5,498.3803,187.5,494.3803,191.5,503.3803,187.5" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M308.3676,187.5 C363.32,187.5 440.3415,187.5 498.3803,187.5" fill="none" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="63.0068" x="378" y="182.5669">&#171;include&#187;</text></g><g class="legend" data-source-line="45"><rect fill="#DDDDDD" height="140.375" rx="7.5" ry="7.5" style="stroke:#000000;stroke-width:1;" width="745.3076" x="98.8462" y="524"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="94.3906" x="103.8462" y="541.9951">Assumptions:</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="340.8467" x="103.8462" y="558.292">1. A Student may cancel only their own booking.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="498.9824" x="103.8462" y="574.5889">2. "Send Booking Confirmation" occurs only after a successful booking.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="591.2813" x="103.8462" y="590.8857">3. Booking confirmation is modeled with &#171;include&#187; because R4 makes it mandatory.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="735.3076" x="103.8462" y="607.1826">4. No &#171;extend&#187; relationship is used because the approved stories define no optional extension behavior.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="401.3721" x="103.8462" y="623.4795">5. Cancellation confirmation is excluded from this model.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="449.8936" x="103.8462" y="639.7764">6. Payments, room equipment, recurring bookings, waiting lists,</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="406.2051" x="117.1968" y="656.0732">other notifications, and user registration are out of scope.</text></g><?plantuml-src TLJBRjim4BppAxQvj05i8Nx41oCruBgzjeKDz-JBcbfPH2XI9IaxGj5_xrAo4Yb9VR9MkyFPcQ4-b0vF1OB6sbO1V4413GfDMO1WmQbJ7Y1LZcHGrWY1CbW7kr2bPCBrQPqMoYWV7FAJ4B4NpKaJtEmAT04sM9ILRuPgs5fRm1Th7vKvmQxsWOeR-2E0VvKdYPx7VYcwD8q7ipwZqdXKMeNw1j33VdCt6NP7iAQxUpyTlj-WaQJXnyKSpFNWhdFs2abR-GYyqTuSuz-3wSFEXyrREh_Gt7iyKTTuFspSaKcxZGzcOqscN85HpcvW8VuASTKKnkDLk-IhmlHrOIR4GFckFd-_V2_4HxZazHAsSt3qks9JFSWU7S0ia0Cwawl1LrAIzrcbuNXrwzD-DxvRt2OYie4aQM0Ni8I71sMaPdAhbH361hhcncOjyUraoUx7A1IL3t0aK0P2Jf1LeNAKYA-LQnciu0wGvNhu35F8RULy8hRJ9QmvVcVgc7Z8U2y641uBFYn6IgBXay4oUOqbJyru2XeRAUstS6WbbG4G3DjtHKn4D2bIVsU1XTZEb_3jFxA8qjcquY8ZzjLy0tcq8J2B5dCY-ibcFpBDryOlnHZeYQsBUkEhfJzjfxVylhzJBCvkUoTfEiM7zYonzhugoiY6aIS92z9bgC0wwX4lXZMwZc8g1_PYNXIP9iFimZ2wLagsfvrkWuFlg9E8MV8CC0YRyb3Ob3HlSb4XxuU84oAHxqzCQe6FBAsAZ4qQyrmdOfx0Tyi3z1IO7_SxqWseprKPWNasVGQ9GSEINJfpqJE2Oi2KCcM8HGFRw8CQ6ZGVgHqfnxEoBX7t2RIVZnR_pGRqr51E8NDiRSYxfHAnIE0drWLhxKTj_EALAsE1ducrSr6IpjmHN50rhcjstu_Y9yGoSnTzLPcIxNwZvdRmLeunJkqLRswk8uZVRmwNbxQa9dnj5iG_?></g></svg>