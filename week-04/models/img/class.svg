ge(startDate, endDate)</text></g><!--class BookingStatus--><g class="entity" data-qualified-name="BookingStatus" data-source-line="35" id="ent0005"><rect fill="#F1F1F1" height="80.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="133.1035" x="1345.5" y="73.2969"/><ellipse cx="1360.5" cy="89.2969" fill="#EB937F" rx="11" ry="11" style="stroke:#181818;stroke-width:1;"/><path d="M1364.6094,95.2969 L1356.8906,95.2969 L1356.8906,82.9063 L1364.6094,82.9063 L1364.6094,85.0625 L1359.3438,85.0625 L1359.3438,87.7344 L1364.1094,87.7344 L1364.1094,89.8906 L1359.3438,89.8906 L1359.3438,93.1406 L1364.6094,93.1406 L1364.6094,95.2969 Z " fill="#000000"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="101.1035" x="1374.5" y="94.1436">BookingStatus</text><line style="stroke:#181818;stroke-width:0.5;" x1="1346.5" x2="1477.6035" y1="105.2969" y2="105.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="50.4561" x="1351.5" y="122.292">ACTIVE</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="83.6719" x="1351.5" y="138.5889">CANCELLED</text><line style="stroke:#181818;stroke-width:0.5;" x1="1346.5" x2="1477.6035" y1="145.8906" y2="145.8906"/></g><g class="entity" data-qualified-name="GMN8" data-source-line="44" id="ent0009"><path d="M449.5,233.2969 L449.5,309.7969 L431.0635,313.7969 L449.5,317.7969 L449.5,394.625 A0,0 0 0 0 449.5,394.625 L842.8345,394.625 A0,0 0 0 0 842.8345,394.625 L842.8345,243.2969 L832.8345,233.2969 L449.5,233.2969 A0,0 0 0 0 449.5,233.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M832.8345,233.2969 L832.8345,243.2969 L842.8345,243.2969 L832.8345,233.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="234.8062" x="455.5" y="250.3638">R1: startTime must be in the future.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="193.8574" x="455.5" y="265.4966">duration &gt; 0 and &lt;= 2 hours.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="455.5" y="280.6294">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="176.4268" x="455.5" y="295.7622">R2: Active bookings for the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="182.9966" x="455.5" y="310.895">same Room cannot overlap.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="335.4038" x="455.5" y="326.0278">Assumption A1: Intervals are half-open [start, end).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="206.0513" x="455.5" y="341.1606">Touching bookings are allowed.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="216.3472" x="455.5" y="356.2935">endTime = startTime + duration.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="372.3345" x="455.5" y="371.4263">US-03: cancel() is permitted only for the owning Student.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="371.1157" x="455.5" y="386.5591">Cancelled records are retained for usage review (US-05).</text></g><g class="entity" data-qualified-name="GMN11" data-source-line="57" id="ent0012"><path d="M699.5,78.2969 L699.5,109.7969 L681.7998,113.7969 L699.5,117.7969 L699.5,148.8281 A0,0 0 0 0 699.5,148.8281 L1046.9854,148.8281 A0,0 0 0 0 1046.9854,148.8281 L1046.9854,88.2969 L1036.9854,78.2969 L699.5,78.2969 A0,0 0 0 0 699.5,78.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1036.9854,78.2969 L1036.9854,88.2969 L1046.9854,88.2969 L1036.9854,78.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="180.0957" x="705.5" y="95.3638">R3: A blocked Room cannot</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="147.4307" x="705.5" y="110.4966">accept a new Booking.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="326.4854" x="705.5" y="125.6294">Assumption A2: Blocking keeps existing bookings.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="278.0464" x="705.5" y="140.7622">Cancelled bookings release their time slot.</text></g><g class="entity" data-qualified-name="GMN14" data-source-line="64" id="ent0015"><path d="M189,431.2969 L189,471.5625 A0,0 0 0 0 189,471.5625 L372.7285,471.5625 A0,0 0 0 0 372.7285,471.5625 L372.7285,441.2969 L362.7285,431.2969 L285,431.2969 L281,386.9109 L277,431.2969 L189,431.2969 A0,0 0 0 0 189,431.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M362.7285,431.2969 L362.7285,441.2969 L372.7285,441.2969 L362.7285,431.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="162.043" x="195" y="448.3638">R4: A successful booking</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="162.7285" x="195" y="463.4966">produces a confirmation.</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" data-link-type="association" id="lnk6"><path d="M210.4787,178.5352 C220.8702,198.319 232.3968,220.2638 243.0685,240.5812" fill="none" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="42.9292" x="231" y="210.3638">makes</text><text fill="#000000" font-family="s